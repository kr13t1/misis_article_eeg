name: Build HFD-U1 article PDF
on:
  push:
    branches: [main]
    paths:
      - 'article.tex'
      - 'article_body_hfd_u1.tex'
      - 'misisarticle.cls'
      - '.github/workflows/build-article.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XeLaTeX and Cyrillic fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-lang-cyrillic texlive-latex-extra texlive-fonts-recommended fonts-texgyre
      - name: Compile manuscript
        run: |
          xelatex -interaction=nonstopmode -halt-on-error article.tex
          xelatex -interaction=nonstopmode -halt-on-error article.tex
      - name: Upload PDF and compilation log
        uses: actions/upload-artifact@v4
        with:
          name: HFD-U1-MISIS-PDF
          path: |
            article.pdf
            article.log
          retention-days: 30
